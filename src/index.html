<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>JAI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #17181c; }
      body { font: 13px/1.4 -apple-system, "PingFang SC", "Segoe UI", sans-serif; user-select: none; }
      #tabbar {
        height: 40px; /* 与 Rust 侧 TABBAR_HEIGHT 保持一致 */
        display: flex; align-items: stretch;
        background: #232428; border-bottom: 1px solid #101114;
      }
      .tab {
        display: flex; align-items: center; padding: 0 18px;
        color: #8b8e98; cursor: pointer; border-right: 1px solid #101114;
      }
      .tab:hover { color: #d6d8de; }
      .tab.active { color: #fff; background: #17181c; box-shadow: inset 0 2px 0 #4c8dff; }
      #spacer { flex: 1; }
      #reload {
        display: flex; align-items: center; padding: 0 14px;
        color: #8b8e98; cursor: pointer; font-size: 15px;
      }
      #reload:hover { color: #fff; }
      #hint {
        position: absolute; top: 40px; left: 0; right: 0; bottom: 0;
        display: flex; align-items: center; justify-content: center;
        color: #565a64;
      }
    </style>
  </head>
  <body>
    <div id="tabbar">
      <div class="tab active" data-tab="deepseek">DeepSeek</div>
      <div class="tab" data-tab="kimi">Kimi</div>
      <div id="spacer"></div>
      <div id="reload" title="刷新当前页">⟳</div>
    </div>
    <div id="hint">页面加载中…</div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;

      document.querySelectorAll('.tab[data-tab]').forEach((el) => {
        el.addEventListener('click', () => invoke('switch_tab', { name: el.dataset.tab }));
      });
      document.getElementById('reload').addEventListener('click', () => {
        const active = document.querySelector('.tab.active')?.dataset.tab;
        if (active) invoke('reload_tab', { name: active });
      });

      // 快捷键（Cmd+1/2）触发的切换也在这里同步高亮
      listen('tab-changed', (event) => {
        document.querySelectorAll('.tab[data-tab]').forEach((el) => {
          el.classList.toggle('active', el.dataset.tab === event.payload);
        });
      });

      // 临时诊断：上报本地页面视口指标，用于定位窗口模式下的几何偏差
      // 上报视口高度：Rust 侧用它校准子 webview 的几何（窗口高度含标题栏，视口不含）
      const reportViewport = () => {
        invoke('report_viewport', { innerH: window.innerHeight });
      };
      window.addEventListener('resize', reportViewport);
      reportViewport();
    </script>
  </body>
</html>
