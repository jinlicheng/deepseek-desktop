name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: '构建类型：debug 带调试信息与控制台，并默认开启诊断日志'
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: write

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # 免费的 macOS 运行器是 Apple Silicon，出通用包（Intel + M 系列都能运行）
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets for universal macOS build
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ inputs.profile == 'debug' && '--debug' || '' }}
          # 只有推 tag（v*）时才发布 release；debug 构建永远不发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && inputs.profile != 'debug' && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && inputs.profile != 'debug' && format('JAI {0}', github.ref_name) || '' }}
          releaseBody: |
            每个平台提供两份产物：**安装包**（installer）和**免安装的可运行程序**（portable）。
            - Windows：`*-setup.exe` 安装包；`jai.exe` 双击即可运行
            - macOS：`.dmg` 安装包；`JAI.app.zip` 解压后双击运行
            - Linux：`.deb` / `.rpm` 安装包；`jai-linux-x86_64.tar.gz` 或 `.AppImage` 免安装运行
            均未做代码签名：macOS 首次打开需右键 → 打开；Windows 会弹出 SmartScreen 提示，选「仍要运行」。
            功能与用法见 README。
          releaseDraft: false
          prerelease: false

      # 把 bundler 之外的可运行程序挑出来，统一放进 portable/
      - name: Package portable build
        shell: bash
        run: |
          set -euo pipefail
          # debug 构建的产物在 target/debug，release 在 target/release
          profile=release
          if [ "${{ inputs.profile }}" = "debug" ]; then profile=debug; fi
          mkdir -p portable
          case "${{ matrix.platform }}" in
            windows-latest)
              cp "src-tauri/target/$profile/jai.exe" portable/
              # debug 构建带 PDB，抓栈时要用
              if [ -f "src-tauri/target/$profile/jai.pdb" ]; then
                cp "src-tauri/target/$profile/jai.pdb" portable/
              fi
              ;;
            macos-latest)
              # ditto 能保住 .app 里的可执行权限与符号链接，解开即用
              ditto -c -k --sequesterRsrc --keepParent \
                "src-tauri/target/universal-apple-darwin/$profile/bundle/macos/JAI.app" \
                portable/JAI.app.zip
              ;;
            ubuntu-latest)
              # 打成 tar.gz 是为了保住可执行位：artifacts 的 zip 会丢掉权限
              tar -czf portable/jai-linux-x86_64.tar.gz -C "src-tauri/target/$profile" jai
              cp "src-tauri/target/$profile/bundle/appimage/"*.AppImage portable/
              ;;
          esac
          ls -lh portable

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: jai-installer-${{ matrix.platform }}${{ inputs.profile == 'debug' && '-debug' || '' }}
          path: |
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: jai-portable-${{ matrix.platform }}${{ inputs.profile == 'debug' && '-debug' || '' }}
          path: portable/*
          if-no-files-found: error

      # tauri-action 只把 bundler 产物挂上 release，portable/ 要自己补
      - name: Attach portable build to release
        if: startsWith(github.ref, 'refs/tags/') && inputs.profile != 'debug'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" portable/* --clobber
